<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security: Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.googletagmanager.com https://www.google-analytics.com https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://www.google-analytics.com https://analytics.google.com;" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="no-referrer" />

  <!-- SEO Meta -->
  <title>Election Guide — Understand How Elections Work</title>
  <meta name="description" content="An interactive assistant that helps you understand how elections work, step by step. Learn about voter registration, eligibility, voting methods, and more." />
  <meta name="keywords" content="election, voting, voter registration, election process, how to vote, eligibility, election guide" />
  <meta name="author" content="Nandan Gaikwad" />

  <!-- Open Graph -->
  <meta property="og:title" content="Election Guide — Interactive Election Assistant" />
  <meta property="og:description" content="Learn how elections work step by step. Covers India, USA, UK, and general processes." />
  <meta property="og:type" content="website" />

  <!-- Structured Data (JSON-LD) for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Election Guide",
    "description": "An interactive assistant that helps users understand how elections work across multiple countries.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Nandan Gaikwad" }
  }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Google Analytics (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Accessibility: Skip to main content link -->
  <a href="#chat-area" class="skip-link" id="skip-link">Skip to chat</a>

  <!-- ARIA Live Region for screen reader announcements -->
  <div id="aria-live-region" class="sr-only" aria-live="polite" aria-atomic="true" role="status"></div>

  <!-- Animated background -->
  <div class="bg-animation" aria-hidden="true">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <div class="bg-grid"></div>
  </div>

  <div id="app" role="application" aria-label="Election Guide Assistant">
    <!-- Header -->
    <header id="app-header" class="header" role="banner">
      <div class="header__brand">
        <div class="header__icon" aria-hidden="true">🗳️</div>
        <div>
          <h1 class="header__title">Election Guide</h1>
          <p class="header__subtitle">Your interactive election assistant</p>
        </div>
      </div>
      <nav class="header__actions" aria-label="Application controls">
        <button id="btn-reset" class="btn btn--ghost" title="Start Over" aria-label="Start conversation over">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span>Start Over</span>
        </button>
      </nav>
    </header>

    <!-- Main Chat Area -->
    <main id="chat-area" class="chat-area" role="log" aria-label="Chat messages" aria-live="polite">
      <div id="messages" class="messages" role="list"></div>
    </main>

    <!-- Quick Actions Bar -->
    <div id="quick-actions" class="quick-actions" role="toolbar" aria-label="Quick action buttons"></div>

    <!-- Input Bar -->
    <footer id="input-bar" class="input-bar" role="contentinfo">
      <div class="input-bar__container">
        <label for="user-input" class="sr-only">Type your question about elections</label>
        <input
          id="user-input"
          class="input-bar__field"
          type="text"
          placeholder="Type your question about elections..."
          autocomplete="off"
          aria-label="Type your question about elections"
          maxlength="500"
        />
        <button id="btn-send" class="btn btn--primary btn--send" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Firebase SDK (compat mode for broad browser support) -->
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-app-compat.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-analytics-compat.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.12.0/firebase-firestore-compat.min.js"></script>

  <!-- Application Scripts -->
  <script src="security.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Election Guide — Understand How Elections Work</title>
  <meta name="description" content="An interactive assistant that helps you understand how elections work, step by step. Learn about voter registration, eligibility, voting methods, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background -->
  <div class="bg-animation" aria-hidden="true">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
    <div class="bg-grid"></div>
  </div>

  <div id="app">
    <!-- Header -->
    <header id="app-header" class="header">
      <div class="header__brand">
        <div class="header__icon">🗳️</div>
        <div>
          <h1 class="header__title">Election Guide</h1>
          <p class="header__subtitle">Your interactive election assistant</p>
        </div>
      </div>
      <div class="header__actions">
        <button id="btn-reset" class="btn btn--ghost" title="Start Over" aria-label="Start Over">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          <span>Start Over</span>
        </button>
      </div>
    </header>

    <!-- Main Chat Area -->
    <main id="chat-area" class="chat-area">
      <div id="messages" class="messages"></div>
    </main>

    <!-- Quick Actions Bar -->
    <div id="quick-actions" class="quick-actions"></div>

    <!-- Input Bar -->
    <footer id="input-bar" class="input-bar">
      <div class="input-bar__container">
        <input
          id="user-input"
          class="input-bar__field"
          type="text"
          placeholder="Type your question about elections..."
          autocomplete="off"
          aria-label="Type your question"
        />
        <button id="btn-send" class="btn btn--primary btn--send" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
